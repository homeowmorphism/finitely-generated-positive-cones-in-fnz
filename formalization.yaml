# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4

project:
  name: Finitely generated positive cones in F_n × Z
  description: >-
    This Lean 4 formalization proves that, for every integer n at least two,
    the direct product of the free group of rank n with the infinite cyclic
    group has a positive cone generated by finitely many elements as a
    semigroup if and only if n is even. It formalizes Theorem 1.1 and
    Corollary 1.2 of Hang Lu Su's arXiv:2608.31103v1. The even-rank construction
    passes a positive cone through two finite-index subgroups. The converse
    derives the parity obstruction from finite circle domains and their
    endpoint actions. The required base-cone theorem and the supporting
    algebraic and dynamical arguments are proved within Lean.
  authors:
    - Hang Lu Su
  responsible_maintainers:
    - Hang Lu Su
  license: Apache-2.0

classification:
  arxiv: [math.GR]
  msc2020: [20F60, 06F15, 20E05]

sources:
  - title: Finitely generated positive cones in F_n × Z
    authors: [Hang Lu Su]
    id: https://arxiv.org/abs/2608.31103v1
    type: paper
    location: Theorem 1.1, Corollary 1.2, and Sections 2–5
    relationship: formalizes
    note: >-
      The two submitted statements have the same rank restriction and
      conclusions as the source. The construction follows its subgroup tower.
      Several intermediate proofs and the proof of the converse are replaced;
      see fidelity.divergences. No claim is made that the formal proof follows
      every step of the paper.

  - title: Formal language convexity in left-orderable groups
    authors: [Hang Lu Su]
    id: https://arxiv.org/abs/1905.13001
    type: paper
    location: Section 5, Proposition 5.2, and the proof of Corollary 1.3
    relationship: formalizes
    note: >-
      Source of the rank-two cone and the first finite-index subgroup
      construction recalled in Section 3 of arXiv:2608.31103v1. The local
      construction proves the marked subgroup isomorphism using a weighted
      action. This entry does not claim formalization of the paper's general
      results on formal languages.

  - title: On braid groups
    authors: [T. V. Dubrovina, N. I. Dubrovin]
    id: https://doi.org/10.1070/SM2001v192n05ABEH000564
    type: paper
    location: Theorem 5, specialized to B_3
    relationship: formalizes
    note: >-
      Original source of the base cone attributed in Su's Theorem 3.1. The
      formal development uses the presentation with relation ba²b = a and
      the strict semigroup generated by a and b. It proves the corresponding
      result locally through Navas's presentation, without importing a braid
      group theorem or assuming an external result.

  - title: >-
      A remarkable family of left-ordered groups: central extensions of Hecke groups
    authors: [Andrés Navas]
    id: https://arxiv.org/abs/0909.4994v3
    type: paper
    location: Main Theorem at parameter n = 2; Sections 1–3
    relationship: formalizes
    note: >-
      Supplies the precise base-cone statement for the presentation ba²b = a.
      External/BaseCone.lean proves exclusion of identity by an explicit
      piecewise linear action and proves totality by central positive
      fractions and word normalization. The general parameter family is
      outside this formalization's scope.

  - title: Ping-pong configurations and circular orders on free groups
    authors: [Dominique Malicet, Kathryn Mann, Cristóbal Rivas, Michele Triestino]
    id: https://arxiv.org/abs/1709.02348v2
    type: paper
    location: Theorems 1.1 and 1.3, Proposition 2.8, Section 3.1, and Proposition 4.12
    relationship: formalizes
    note: >-
      Source of the odd-rank obstruction cited by Su's Corollary 1.2. The
      submitted classification uses a direct proof under finite positive
      generation, with circle domains and endpoint parity. The library also
      proves the stronger odd-rank non-isolation statements separately in
      External/OddRankComplete.lean and External/CircularIsolatedComplete.lean.
      These use replacement proofs described in EXTERNAL_OBLIGATIONS.md.

  - title: Group orderings, dynamics, and rigidity
    authors: [Kathryn Mann, Cristóbal Rivas]
    id: https://doi.org/10.5802/aif.3191
    type: paper
    location: Proposition 4.7, Theorem 1.5, and the cofinal quotient construction
    relationship: adapts
    note: >-
      Source of circle-domain and order-lifting arguments used in the
      auxiliary isolated-order development. The local isolation transfer
      constructs a continuous injective lift through the given cofinal
      order. It does not infer the required direction from continuity and
      local injectivity of the quotient map alone. See COFINAL_REVIEW.md and
      CIRCULAR_SEPARATION_REVIEW.md.

  - title: Isolated circular orders of PSL(2,Z)
    authors: [Shigenori Matsumoto]
    id: https://doi.org/10.4171/GGD/635
    type: paper
    location: Lemma 7.2, page 1430
    relationship: adapts
    note: >-
      The development notes attribute the closed-suffix avoidance method in
      the auxiliary isolated-order branch to this lemma, adapted to free
      group words. This does not formalize the paper's classification for
      PSL(2,Z). See CIRCULAR_SEPARATION_REVIEW.md; AUDIT_REPORT.md records that
      its reviewer did not verify this source correspondence against the paper.

related_formalizations: []

status:
  scope: >-
    The selected Comparator entry covers even-rank existence and the parity
    classification for all natural ranks n with 2 ≤ n, including n = 2.
    A positive cone is a multiplication-closed subset excluding the identity
    such that each nonidentity element or its inverse belongs to it. Finite
    generation means generation by nonempty semigroup products. The cyclic
    factor is represented by Multiplicative ℤ. No assertion for ranks zero
    or one is selected. The library additionally proves an upper bound
    6*(n-1)+1 on a generating set and stronger odd-rank non-isolation results;
    these are not separate selected claims. There is no minimality claim.
    The sorry counts below exclude the deliberate Challenge placeholders.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: FnZPositiveCones.evenRank_hasFGPositiveCone
      file: FnZPositiveCones/Main.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      literature_dependencies: []
    - declaration: FnZPositiveCones.hasFGPositiveCone_iff_even
      file: FnZPositiveCones/Main.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      literature_dependencies: []

automation:
  methods:
    - method: agent
      models: [claude-fable-5-1]
      framework: Claude Code
      tool_setup: >-
        Drafted the initial blueprint package from the source paper, committed
        on 2026-09-20: blueprint.md, the first version of Interfaces.lean,
        certificate_data.json, and verify_certificates.py. It then ran a
        multi-agent audit of that package against the paper (2026-09-19 to
        2026-09-21), with local Lean elaboration checks.
      prompting_notes: >-
        blueprint.md records the mathematical specifications and proof plans
        given to the development agents, including the replacement arguments
        for the marked isomorphism and the explicit free basis.
    - method: agent
      models: [gpt-6-astra]
      framework: Codex
      tool_setup: >-
        Developed the Lean library from the blueprint (2026-09-20 to
        2026-10-07): definitions, proof scripts, replacement proof arguments,
        the Lean audit files, documentation, and every review report except
        AUDIT_REPORT.md. It used local Lean/Lake builds, Mathlib source
        inspection, shell tools, and parallel implementation and review
        tasks. It also prepared the Palomar submission: the independent
        Challenge statements, proof adapters, metadata, module packaging,
        repository cleanup, and verification commands. Codex's built-in
        action-approval reviewer (codex-auto-review) approved tool calls but
        contributed no content.
      prompting_notes: >-
        The retained review reports describe statement, source, and dependency
        checks at earlier snapshots. Commit hashes in those reports, and
        development records removed during submission cleanup, refer to the
        private development repository, which is not part of this public
        snapshot.
    - method: agent
      models: [claude-opus-5]
      framework: Claude Code
      tool_setup: >-
        Ran the adversarial audit recorded in AUDIT_REPORT.md at commit
        6881f5d of the private development repository (2026-09-22). Its Lean
        probe files are not part of this snapshot.
    - method: agent
      models: [claude-opus-5-5]
      framework: Claude Code
      tool_setup: >-
        Made the final submission edits on 2026-10-11: docstrings in
        Interfaces.lean, the restored module header in Main.lean, the
        provenance notes in the review reports and in this file, and this
        one-commit public snapshot of the private development repository.
  notes: >-
    Hang Lu Su is the human author and responsible maintainer, wrote the
    source paper, and directed the agents. AI involvement was substantial and
    included proof construction and proposed replacement arguments. Review
    agents also inspected types, definitions, dependencies, and proof
    architecture. Lean kernel checking supplies the formal proof check. The
    Python certificate checker is supplementary development evidence. Model
    identifiers come from the local Claude Code and Codex session logs and
    from commit trailers in the private development repository. Costs and
    cumulative effort are not recorded here. No novelty claim is made for
    the replacement arguments, and no earlier formalization of these
    endpoints is identified in the project records.

fidelity:
  divergences: >-
    No change to the statements of Su's Theorem 1.1 and Corollary 1.2 is
    intended. Proof differences are substantial. Weighted actions give the
    marked rank-two product isomorphism and an explicit free basis for the
    covering subgroup. The base-cone proof uses a piecewise linear action
    and positive-word normalization. The selected classification uses a
    direct finite-generation argument instead of invoking MMRT's full
    isolated-order theorem. The stronger theorem is also proved in a
    separate branch using central-orbit endpoints, cofinal quotient/lift
    constructions, and circular separation arguments. EXTERNAL_OBLIGATIONS.md
    and the review reports describe these replacements. The blueprint
    preserves a historical proof plan; it is not a verification report.

review:
  status: agent-reviewed
  reviewers:
    - Codex review agents (gpt-6-astra); every review report except AUDIT_REPORT.md
    - Claude Code (claude-opus-5); AUDIT_REPORT.md
    - Claude Code multi-agent blueprint audit (claude-fable-5-1); no report file in this snapshot
  notes: >-
    The Claude Code audit of the blueprint package (2026-09-19 to 2026-09-21)
    found no mathematical error and proposed corrections before the Lean
    development began. CLASSIFICATION_REVIEW.md records a distinct agent review of the direct
    classification proof. FINAL_ENDPOINT_REVIEW.md and
    FINAL_CONTRACT_REVIEW.md record statement and dependency checks;
    FINAL_CONTRACT_REVIEW.md explicitly discloses overlap between its
    reviewer and earlier implementation work. AUDIT_REPORT.md records an
    adversarial audit at commit 6881f5d of the private development
    repository, including exact endpoint types,
    project-wide axiom checks, and limitations on its literature review.
    These reports document earlier snapshots and do not certify later edits.
    Their use of independent means review by separate AI agents. No completed
    independent human mathematical review is documented. Palomar's own
    review and full verification report are not included in this status.

alignment:
  namespace: FnZPositiveCones
  statements:
    - source: arXiv:2608.31103v1, Theorem 1.1
      lean: FnZPositiveCones.evenRank_hasFGPositiveCone
      module: FnZPositiveCones.Main
      comparator_declaration: Palomar.evenRank_hasFGPositiveCone
      comparator_config: comparator.json
      status: proved
      note: >-
        Every even natural rank n with 2 ≤ n has a finitely generated positive
        cone. The Palomar declaration in Solution.lean applies this library
        theorem to the independent definitions also stated in Challenge.lean.
    - source: arXiv:2608.31103v1, Corollary 1.2
      lean: FnZPositiveCones.hasFGPositiveCone_iff_even
      module: FnZPositiveCones.Main
      comparator_declaration: Palomar.hasFGPositiveCone_iff_even
      comparator_config: comparator.json
      status: proved
      note: >-
        For 2 ≤ n, finite positive generation exists exactly when n is even.
        The Palomar declaration in Solution.lean applies this library theorem
        to the independent definitions also stated in Challenge.lean.

acknowledgements: >-
  The formal development uses Lean 4 and Mathlib. The mathematical source
  authors are credited above. AI tools and their roles are disclosed under
  automation and review.
